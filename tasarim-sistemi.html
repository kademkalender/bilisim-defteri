<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasarım Sistemi · Bilişim Defteri</title>
<meta name="description" content="Bilişim Defteri sitesinin renkleri, ölçüleri, ikonları ve bileşenleri. Bileşenler sitenin kendi stil dosyasıyla çizilir.">
<!-- Sitenin kendi stilleri: katalogdaki her bileşen sitede nasıl görünüyorsa öyle görünür. -->
<link rel="icon" href="assets/maskot-64.png">
<link rel="stylesheet" href="assets/mulish.css">
<link rel="stylesheet" href="assets/style.css">
<style>
/* Yalnızca kataloğun kendi kabuğu. Değerler sitenin token'larından gelir, ds- önekiyle siteden ayrılır. */
body{background:var(--surface-subtle)}
.ds-top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;padding:10px var(--space-4);background:var(--surface-default);border-bottom:1px solid var(--border-default)}
.ds-top .logo small{font-size:.85rem;font-weight:700;color:var(--text-secondary);margin-left:var(--space-2)}
.ds-top .ds-role{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
.ds-top .ds-role > span{font-size:.85rem;font-weight:800;color:var(--text-secondary)}
.ds-wrap{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;align-items:start;min-height:calc(100vh - 69px)}
.ds-wrap.no-props{grid-template-columns:250px minmax(0,1fr)}
.ds-side{position:sticky;top:69px;max-height:calc(100vh - 69px);overflow:auto;padding:var(--space-4);border-right:1px solid var(--border-default);background:var(--surface-default)}
.ds-filter{width:100%;height:var(--size-control-sm);font:inherit;font-size:.9rem;padding:0 var(--space-3);border:1.5px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-subtle);color:var(--text-primary)}
.ds-group{margin:var(--space-4) 0 var(--space-1);font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--text-secondary)}
.ds-side a{display:flex;justify-content:space-between;align-items:center;min-height:36px;padding:0 var(--space-3);border-radius:var(--radius-sm);color:var(--text-primary);text-decoration:none;font-weight:700;font-size:.92rem}
.ds-side a:hover{background:var(--surface-hover)}
.ds-side a[aria-current="page"]{background:var(--action-primary-subtle);color:var(--action-primary)}
.ds-side a small{font-size:.75rem;font-weight:800;color:var(--text-secondary)}
.ds-side .ds-none{font-size:.88rem;color:var(--text-secondary);margin:var(--space-3) 0 0}
.ds-main{padding:var(--space-6) var(--space-8) var(--space-10);min-width:0}
.ds-main > * + *{margin-top:var(--space-5)}
.ds-eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.06em;color:var(--action-primary)}
.ds-main h1{font-size:2rem;margin-top:var(--space-1)}
.ds-lead{margin:var(--space-2) 0 0;color:var(--text-secondary);max-width:70ch}
.ds-meta{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--text-secondary)}
.ds-tabs{margin-top:var(--space-6)}
.ds-tabs .tab small{font-size:.75rem;font-weight:800;color:var(--text-secondary);background:var(--surface-default);border-radius:var(--radius-pill);padding:0 var(--space-2)}
.ds-bgsw{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.ds-bgsw .chip-btn{min-height:34px;padding:0 var(--space-3);font-size:.85rem}
.ds-stage{position:relative;border:1px solid var(--border-default);border-radius:var(--radius-xl);background:var(--surface-default);padding:var(--space-8);display:flex;justify-content:center;align-items:center;min-height:240px;overflow:auto}
.ds-stage.gri{background:var(--surface-subtle)}
.ds-stage > .ds-in{width:100%}
.ds-stage .top{position:static}
.ds-color{border-radius:var(--radius-xl);padding:var(--space-6);display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:center}
.ds-rules{background:var(--surface-default);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:var(--space-4) var(--space-5)}
.ds-rules h2{font-size:1.05rem}
.ds-rules ul{margin:var(--space-2) 0 0;padding-left:1.2em}
.ds-rules li + li{margin-top:var(--space-1)}
.ds-rules code,.ds-lead code,.ds-note code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-subtle);border-radius:4px;padding:0 4px}
.ds-vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-4)}
.ds-vars.full{grid-template-columns:1fr}
.ds-var{background:var(--surface-default);border:1px solid var(--border-default);border-radius:var(--radius-xl);overflow:hidden}
.ds-var > b{display:block;padding:var(--space-3) var(--space-4) 0;font-size:.9rem}
.ds-var .ds-stage{border:0;border-radius:0;padding:var(--space-5);min-height:160px}
.ds-code{position:relative;background:var(--text-primary);color:#E9ECF3;border-radius:var(--radius-xl);padding:var(--space-5);overflow:auto;font-family:var(--font-mono);font-size:.82rem;line-height:1.6;white-space:pre;margin:0;max-height:520px}
.ds-codebar{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.ds-props{position:sticky;top:69px;max-height:calc(100vh - 69px);overflow:auto;padding:var(--space-5) var(--space-4);border-left:1px solid var(--border-default);background:var(--surface-default)}
.ds-props-h{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.ds-props-h h2{font-size:1.1rem}
.ds-props-h .chip-btn{min-height:34px;padding:0 var(--space-3);font-size:.82rem}
.ds-prop{display:block;margin-top:var(--space-4)}
.ds-prop > span{display:block;font-weight:800;font-size:.88rem;margin-bottom:var(--space-1)}
.ds-prop > span code{font-family:var(--font-mono);font-weight:400;font-size:.78rem;color:var(--text-secondary);margin-left:var(--space-1)}
.ds-prop input[type="text"]{width:100%;min-height:var(--size-control-sm);font:inherit;font-size:.92rem;padding:0 var(--space-3);border:1.5px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-default);color:var(--text-primary);box-sizing:border-box}
.ds-prop select{width:100%}
.ds-seg{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.ds-seg .chip-btn{min-height:34px;padding:0 var(--space-3);font-size:.82rem}
.ds-check{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:.9rem;cursor:pointer;min-height:var(--size-control-sm)}
.ds-check input{width:20px;height:20px;margin:0}
/* Temeller */
.ds-section h2{font-size:1.25rem;margin-bottom:var(--space-3)}
.ds-section + .ds-section{margin-top:var(--space-8)}
.ds-swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--space-3)}
.ds-sw{background:var(--surface-default);border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden;text-align:left;font:inherit;color:inherit;padding:0;cursor:pointer}
.ds-sw:hover{border-color:var(--action-primary)}
.ds-sw i{display:block;height:64px;border-bottom:1px solid var(--border-default)}
.ds-sw span{display:block;padding:var(--space-2) var(--space-3) var(--space-3);font-size:.82rem}
.ds-sw b{display:block;font-family:var(--font-mono);font-size:.8rem}
.ds-sw em{font-style:normal;color:var(--text-secondary);display:block;margin-top:2px}
.ds-type{background:var(--surface-default);border:1px solid var(--border-default);border-radius:var(--radius-xl)}
.ds-type > div{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--space-4);align-items:center;padding:var(--space-4) var(--space-5)}
.ds-type > div + div{border-top:1px solid var(--border-default)}
.ds-type small{display:block;color:var(--text-secondary);font-weight:700;font-size:.8rem}
.ds-type small code{font-family:var(--font-mono)}
.ds-scale{display:grid;gap:var(--space-2)}
.ds-scale > div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--space-3);align-items:center;font-size:.85rem}
.ds-scale code{font-family:var(--font-mono)}
.ds-bar{height:16px;background:var(--action-primary);border-radius:3px}
.ds-boxes{display:flex;flex-wrap:wrap;gap:var(--space-4)}
.ds-box{width:120px;font-size:.8rem;text-align:center}
.ds-box i{display:block;height:80px;margin-bottom:var(--space-2);background:var(--action-primary-subtle);border:2px solid var(--action-primary)}
.ds-box code{font-family:var(--font-mono)}
.ds-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--space-3)}
.ds-icons button{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-4) var(--space-2);background:var(--surface-default);border:1px solid var(--border-default);border-radius:var(--radius-md);font:inherit;font-size:.82rem;font-weight:700;color:var(--text-primary)}
.ds-icons button:hover{border-color:var(--action-primary)}
.ds-icons .ico{width:32px;height:32px;color:var(--action-primary)}
.ds-note{font-size:.9rem;color:var(--text-secondary);max-width:75ch}
.ds-voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-4)}
.ds-voices h3{display:flex;align-items:center;gap:var(--space-3);font-size:1.05rem}
.ds-voices ul{margin:var(--space-3) 0 0;padding-left:1.2em}
.ds-dd{display:grid;gap:var(--space-2)}
.ds-dd > div{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-2)}
.ds-x,.ds-v{display:block;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-size:.95rem}
.ds-x{background:var(--feedback-error-subtle);color:var(--feedback-error)}
.ds-v{background:var(--feedback-success-subtle);color:var(--feedback-success);font-weight:700}
.ds-toast{position:fixed;left:50%;bottom:var(--space-6);transform:translateX(-50%);background:var(--text-primary);color:#fff;padding:var(--space-2) var(--space-4);border-radius:var(--radius-pill);font-weight:700;font-size:.9rem;z-index:60;display:none}
.ds-toast.show{display:block}
@media (max-width:1180px){
  .ds-wrap,.ds-wrap.no-props{grid-template-columns:230px minmax(0,1fr)}
  .ds-props{position:static;max-height:none;grid-column:2;border-left:0;border-top:1px solid var(--border-default)}
  .ds-main{padding:var(--space-5)}
}
@media (max-width:760px){
  .ds-wrap,.ds-wrap.no-props{display:block}
  .ds-side{position:static;max-height:40vh;border-right:0;border-bottom:1px solid var(--border-default)}
  .ds-main{padding:var(--space-4)}
  .ds-stage{padding:var(--space-4)}
  .ds-type > div{grid-template-columns:1fr}
}
</style>
</head>
<body>
<a class="skip" href="#dsMain">İçeriğe geç</a>
<header class="ds-top">
  <a class="logo" href="#renkler"><img class="logo-img" src="assets/maskot.webp" alt="">Bilişim Defteri<small>Tasarım sistemi</small></a>
  <div class="ds-role" role="group" aria-label="Görünüm">
    <span>Görünüm:</span>
    <button type="button" class="chip-btn" data-role="ogretmen" aria-pressed="true">Öğretmen</button>
    <button type="button" class="chip-btn" data-role="ogrenci" aria-pressed="false">Öğrenci</button>
    <a class="chip-btn" href="index.html">Siteyi aç</a>
  </div>
</header>
<div class="ds-wrap" id="dsWrap">
  <nav class="ds-side" aria-label="Katalog">
    <label for="dsFilter" class="sr">Bileşen ara</label>
    <input id="dsFilter" class="ds-filter" type="search" placeholder="Bileşen ara…" autocomplete="off">
    <div id="dsNav"></div>
  </nav>
  <div class="ds-main" id="dsMain" role="main" tabindex="-1"></div>
  <aside class="ds-props" id="dsProps" aria-label="Özellikler"></aside>
</div>
<div class="ds-toast" id="dsToast" role="status"></div>

<script src="content/program.js"></script>
<script src="content/plan.js"></script>
<script src="content/lessons/5-1-6-dosya-klasor.js"></script>
<script src="assets/ikonlar.js"></script>
<script>
/* Bilişim Defteri tasarım sistemi kataloğu.
   Bileşenler sitenin kendi sınıflarıyla (assets/style.css) ve gerçek ders verisiyle (5-1-6) çizilir.
   Sitede yeni bir arayüz parçası gerekirse önce buraya eklenir, sonra sitede aynı işaretleme kullanılır. */
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem("bdds:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("bdds:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  // Sitedeki icon() ile aynı çıktı; data-ico yalnızca Kod sekmesinde icon("ad") yazabilmek için
  var ico = function (k) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" data-ico="' + k + '">' + BD.icons[k] + '</svg>'; };
  var L = BD.lessons["5-1-6-dosya-klasor"];
  var TH = BD.program["5"].themes;
  var role = store.get("role", "ogretmen");
  var T = function () { return role === "ogretmen"; };

  var SEC = { slayt: "Sunum", defter: "Deftere yaz", etkinlik: "Etkinlik", oyun: "Oyun", test: "Mini test", bulmaca: "Bulmaca" };
  var SEC_N = { slayt: L.slides.length + " slayt", defter: L.notebook.length + " madde", etkinlik: "8 görev", oyun: L.sort.items.length + " kart", test: L.quiz.length + " soru", bulmaca: L.crossword.length + " kelime" };
  var outcomeTitle = function (code) { var o = null; TH.forEach(function (t) { (t.outcomes || []).forEach(function (x) { if (x.code === code) o = x; }); }); return o ? o.title : ""; };
  var themeOpts = TH.map(function (t) { return [String(t.no), t.no + ". " + t.name]; });
  var secOpts = Object.keys(SEC).map(function (k) { return [k, SEC[k]]; });
  var iconOpts = Object.keys(BD.icons).map(function (k) { return [k, k]; });
  var bool = function (v) { return v === true || v === "true"; };

  /* ---------- Bileşenler ----------
     render(p): sitedeki işaretleme (Kod sekmesinde görünen). wrap(p, html): yalnızca önizlemenin çerçevesi. */
  var C = [];
  var add = function (o) { C.push(o); };

  add({ id: "dugme", group: "Eylemler", name: "Düğme", cls: ".btn",
    desc: "Bir işi başlatır: derse gitmek, yazdırmak, sıfırlamak.",
    where: "Bu hafta kartı, ders planı, bölüm sonu, çalışma kâğıdı.",
    rules: ["50 px yükseklik, köşe <code>--radius-md</code>.", "Bir görünümde tek birincil düğme olur.", "<code>on-color</code> ve <code>on-color-line</code> yalnızca tema renkli kartın (Bu hafta) üstünde kullanılır.", "İkon <code>icon(\"ad\")</code> ile eklenir, emoji değil."],
    props: [
      { k: "metin", l: "Metin", t: "text", d: "Derse git" },
      { k: "tur", l: "Tür", t: "seg", d: "primary", o: [["", "Varsayılan"], ["primary", "Birincil"], ["on-color", "Renkli üstü"], ["on-color-line", "Renkli üstü çizgi"]] },
      { k: "ikon", l: "İkon", t: "select", d: "", o: [["", "yok"]].concat(iconOpts) }
    ],
    render: function (p) { return '<button type="button" class="btn' + (p.tur ? " " + p.tur : "") + '">' + (p.ikon ? ico(p.ikon) + " " : "") + esc(p.metin) + '</button>'; },
    wrap: function (p, h) { return /on-color/.test(p.tur) ? '<div class="ds-color" style="background:var(--theme-1)">' + h + '</div>' : h; },
    variants: [["Varsayılan", { tur: "", metin: "Değiştir" }], ["Birincil", {}], ["İkonlu", { tur: "", ikon: "yazdir", metin: "Çalışma kâğıdı" }], ["Renkli kart üstünde", { tur: "on-color", metin: "Başla" }], ["Renkli kart üstünde, ikinci", { tur: "on-color-line", ikon: "yazdir", metin: "Çalışma kâğıdı" }]]
  });

  add({ id: "secim", group: "Eylemler", name: "Seçim düğmesi", cls: ".chip-btn",
    desc: "Birkaç seçenekten birini seçer ya da üst banttaki sayfaları açar.",
    where: "Üst bant, ders içinde sınıf ortamı seçimi.",
    rules: ["40 px, köşe <code>--radius-md</code>. Üst bantta 48 px.", "Seçili olan dolu laciverttir: düğmede <code>aria-pressed=\"true\"</code>, bağlantıda <code>aria-current=\"page\"</code>.", "Banttaki ayarlar (rol, A+) bej zeminli ve kenarlıksızdır, sayfa bağlantılarından ince ayraçla ayrılır."],
    props: [
      { k: "metin", l: "Metin", t: "text", d: "Laboratuvar" },
      { k: "secili", l: "Seçili", t: "bool", d: false },
      { k: "yer", l: "Yer", t: "seg", d: "sayfa", o: [["sayfa", "Sayfada"], ["bant", "Üst bantta"], ["ayar", "Bantta ayar"]] }
    ],
    render: function (p) {
      if (p.yer === "bant") return '<a class="chip-btn" href="#kazanimlar"' + (bool(p.secili) ? ' aria-current="page"' : "") + '>' + esc(p.metin) + '</a>';
      return '<button type="button" class="chip-btn" aria-pressed="' + bool(p.secili) + '">' + esc(p.metin) + '</button>';
    },
    wrap: function (p, h) {
      if (p.yer === "sayfa") return h;
      return '<div class="top"><div class="top-in"><nav>' + (p.yer === "ayar" ? '<span class="top-set">' + h + '</span>' : h) + '</nav></div></div>';
    },
    variants: [["Sayfada", {}], ["Sayfada, seçili", { secili: true }], ["Üst bantta", { yer: "bant", metin: "Kazanım haritası" }], ["Üst bantta, açık sayfa", { yer: "bant", metin: "Kazanım haritası", secili: true }], ["Bantta ayar", { yer: "ayar", metin: "A+" }], ["Bantta ayar, basılı", { yer: "ayar", metin: "A+", secili: true }]]
  });

  add({ id: "secenek", group: "Eylemler", name: "Seçenek düğmesi", cls: ".opt-group button",
    desc: "Açıklamalı seçenek. Bir ayarın değerleri arasından biri seçilir.",
    where: "Sınıf ayarları.",
    rules: ["En az 64 px yükseklik, en fazla 300 px genişlik.", "Seçili olanda sağ üstte ✓ ve açık lacivert zemin.", "Bir grupta tek seçili seçenek olur; grup <code>.opt-group</code>."],
    props: [
      { k: "baslik", l: "Başlık", t: "text", d: "İnternet var" },
      { k: "aciklama", l: "Açıklama", t: "text", d: "İsteğe bağlı çevrim içi araştırma önerileri gösterilir" },
      { k: "ikon", l: "İkon", t: "select", d: "", o: [["", "yok"]].concat(iconOpts) },
      { k: "secili", l: "Seçili", t: "bool", d: true }
    ],
    render: function (p) { return '<div class="opt-group"><button type="button" aria-pressed="' + bool(p.secili) + '">' + (p.ikon ? ico(p.ikon) + " " : "") + esc(p.baslik) + (p.aciklama ? '<small>' + esc(p.aciklama) + '</small>' : "") + '</button></div>'; },
    variants: [["Seçili", {}], ["Seçili değil", { secili: false, baslik: "İnternet yok", aciklama: "Etkinlikler internetsiz yapılır" }], ["İkonlu", { ikon: "ekran", baslik: BD.envs.lab.name, aciklama: BD.envs.lab.desc }], ["Açıklamasız", { aciklama: "", baslik: "Pardus" }]]
  });

  add({ id: "arama", group: "Formlar", name: "Arama kutusu", cls: ".search",
    desc: "Ders, hafta ya da kazanım kodu arar. Sonuçlar kutunun altında açılır.",
    where: "Üst bant (yalnızca öğretmen).",
    rules: ["48 px, köşe <code>--radius-md</code>. Genişlik 160–230 px.", "Öğrencide gizlidir.", "İpucu ne aranabileceğini söyler: öğretmen dersi hafta numarasıyla arar. Emoji yok.", "Sonuçta ders adı, altında sınıf · hafta · kod · durum. Sonuç yoksa aranan kelime ve ne yazılacağı: <i>\"zip\" için sonuç yok. Ders adı ya da hafta numarası yazın.</i>", "Eş anlamlılar aranır (kodlama → programlama, zip → sıkıştır, word → kelime işlemci…); liste <code>initSearch</code> içinde <code>SYN</code>.", "En çok 8 sonuç; fazlası varsa altta \"İlk 8 sonuç. Daha fazlası için aramayı daraltın.\""],
    props: [
      { k: "ipucu", l: "İpucu", t: "text", d: "Ders, hafta, kod" },
      { k: "durum", l: "Durum", t: "seg", d: "sonuc", o: [["kapali", "Kapalı"], ["sonuc", "Sonuçlar"], ["yok", "Sonuç yok"]] }
    ],
    render: function (p) {
      var res = p.durum === "kapali" ? "" : '<div class="results show">' + (p.durum === "yok" ? '<div>"zip" için sonuç yok. Ders adı ya da hafta numarası yazın.</div>'

      } },
    ikonlar: { group: "Temeller", name: "İkonlar", desc: "Satır içi SVG, 24×24 çizgi. Liste <code>assets/ikonlar.js</code> (<code>BD.icons</code>), sitede <code>icon(\"ad\")</code> ile çizilir. Emoji yerine bunlar kullanılır: Pardus'ta renkli emoji yazı tipi olmayabilir. Basınca <code>icon(\"ad\")</code> kopyalanır.",
      body: function () { return '<div class="ds-icons">' + Object.keys(BD.icons).map(function (k) { return '<button type="button" data-copy=\'icon("' + k + '")\'>' + ico(k) + k + '</button>'; }).join("") + '</div><p class="ds-note">Yeni ikon önce <code>assets/ikonlar.js</code>\'e eklenir, kendiliğinden burada görünür.</p>'; } }
  };
  F.yazim = { group: "Temeller", name: "Ses ve yazım", desc: "Ekrandaki her metnin tonu ve kalıbı. Kuralların tamamı ve terim sözlüğü <code>YAZIM-REHBERI.md</code>'de; burada kısa hâli ve örnekler var.",
    body: function () {
      var pairs = function (rows) { return '<div class="ds-dd">' + rows.map(function (r) { return '<div><span class="ds-x">✗ ' + esc(r[0]) + '</span><span class="ds-v">✓ ' + esc(r[1]) + '</span></div>'; }).join("") + '</div>'; };
      var sec = function (h, note, rows) { return '<section class="ds-section"><h2>' + h + '</h2>' + (note ? '<p class="ds-note" style="margin:0 0 12px">' + note + '</p>' : "") + pairs(rows) + '</section>'; };
      return '<section class="ds-section"><div class="ds-voices">' +
        '<div class="card"><h3><span class="sq-sm" style="background:var(--action-primary)">' + ico("ogrenci") + '</span>Öğrenciye: oyun arkadaşı</h3><ul><li>"sen" der, görev verir, bitince kutlar.</li><li>Puan, seviye, rozet yok; ilerleme sayıyla görünür.</li><li>Ünlem: kutlamada ve göreve çağıran tek cümlede.</li><li>Emoji yok; kutlamayı maskot ve konfeti taşır.</li></ul></div>' +
        '<div class="card"><h3><span class="sq-sm" style="background:var(--theme-1)">' + ico("ogretmen") + '</span>Öğretmene: yardımcı asistan</h3><ul><li>"siz" der; ne yapacağını, gerekirse nedenini söyler.</li><li>Somut: süre, slayt numarası, sayfa adı.</li><li>Ünlem ve emoji yok.</li><li>En fazla iki cümle.</li></ul></div>' +
        '</div><p class="ds-note">Site kendinden "biz" diye söz etmez. Yazı tipi Mulish; dosya adı ve kod eş aralıklı yazılır (Mulish\'te I ile l benzer).</p></section>' +
        sec("Öğrenci metni", "", [["Etkinlik tamamlandı.", "Görev tamam! Sırada Oyun var."], ["Bu derste dosya işlemleri öğretilecektir.", "Dağınık masaüstünü toparla!"], ["Başarı oranınız %80.", "5 sorudan 4'ü doğru."], ["Hadi bakalım minik dostum!", "Görev: Kendi klasörünü oluştur."]]) +
        sec("Öğretmen metni", "", [["Bu haftanın dersi üzerinde çalışıyoruz.", "Bu haftanın dersi henüz hazır değil. 7. haftanın dersini kullanabilirsiniz."], ["Giriş yapılır.", "Giriş · 5 dk: 2. slayttaki soruyu sorun. Konuya merak uyandırır."], ["Ayarlarınız başarıyla kaydedilmiştir!", "Ayarlar kaydedildi. Dersler artık Pardus yönergeleriyle açılır."]]) +
        sec("Yanlış cevap", "Sonuç + neden. İlk yanlışta ipucu ve bir hak daha, ikincide doğru cevap.", [["Yanlış!", "Az kaldı! Uzantıya bak: noktadan sonra gelen kısım dosyanın türünü söyler. Bir daha dene."], ["Olmadı. Doğru cevap ✓ işaretli olan.", "Bu sefer olmadı. .ogg bir ses dosyasıdır. Doğru cevap: kayit.ogg ✓"]]) +
        sec("Düğme", "Fiille başlar; ok, ünlem, emoji yok. Ok yalnızca slayt ve hafta oklarında.", [["Başla →", "Başla"], ["Tamam", "Kontrol et"], ["Evet", "Evet, sıfırla"]]) +
        sec("Başlık", "Cümle düzeni: yalnız ilk harf büyük, özel adlar hariç. Sonda nokta yok. Ders, tema ve kazanım adları MEB'deki gibi kalır (Dosya ve Klasör Yönetimi).", [["Kazanım Haritası", "Kazanım haritası"], ["Haftanın Bulmacası", "Haftanın bulmacası"], ["Bilgi Dünyasına Yolculuk", "Bilgisayar sistemleri"]]) +
        sec("Yönerge ve boş durum", "Ekranla ilgili fiil \"tıkla\". Boş durum: neden boş + ilk adım.", [["Lütfen maddeleri defterinize yazınız.", "Sadece bu maddeleri defterine geçir."], ["Butona basarak cevabı görebilirsin!", "Cevabı görmek için düğmeye tıkla."], ["Sonuç bulunamadı.", "\"klasor\" için sonuç yok. Ders adı ya da hafta numarası yaz."]]) +
        '';
    } };
  var FOUND = ["renkler", "yazi", "olculer", "ikonlar", "yazim"];

  /* ---------- Kod görünümü ---------- */
  var BLOCK = /^(div|section|ul|ol|li|nav|header|details|summary|p|h1|h2|h3|h4|button|a|select|label)$/;
  function pretty(html) {
    html = html.replace(/<svg class="ico"[^>]*data-ico="([^"]+)"[^>]*>[\s\S]*?<\/svg>/g, '<!-- icon("$1") -->');
    var out = "", depth = 0, stack = [], parts = html.split(/(<[^>]+>)/).filter(Boolean);
    var pad = function () { return "\n" + new Array(depth + 1).join("  "); };
    parts.forEach(function (tok) {
      var m = tok.match(/^<(\/?)([a-z0-9]+)/i);
      if (!m) { out += tok; return; }
      var close = m[1] === "/", tag = m[2].toLowerCase(), block = BLOCK.test(tag) && (tag !== "a" && tag !== "button" || / class=/.test(tok) || close);
      if (!close && block) { if (stack.length) stack[stack.length - 1].kids = true; out += pad() + tok; stack.push({ tag: tag, kids: false }); depth++; return; }
      if (close && stack.length && stack[stack.length - 1].tag === tag) { var s = stack.pop(); depth--; out += (s.kids ? pad() : "") + tok; return; }
      out += tok;
    });
    return out.replace(/^\n/, "");
  }

  /* ---------- Görünümler ---------- */
  var state = {}; // bileşen → özellik değerleri
  var cur = null, tab = store.get("tab", "onizleme"), bg = store.get("bg", "beyaz");
  function propsOf(c) { if (!state[c.id]) { state[c.id] = {}; c.props.forEach(function (p) { state[c.id][p.k] = p.d; }); } return state[c.id]; }
  function merged(c, over) { var o = {}, b = propsOf(c), k; for (k in b) o[k] = b[k]; c.props.forEach(function (p) { o[p.k] = p.d; }); for (k in over) o[k] = over[k]; return o; }
  function stage(c, p, cls) { var h = c.render(p); return '<div class="ds-stage' + (bg === "gri" ? " gri" : "") + (cls ? " " + cls : "") + '"><div class="ds-in"' + (c.width === "full" ? "" : ' style="display:flex;justify-content:center"') + '>' + (c.wrap ? c.wrap(p, h) : h) + '</div></div>'; }

  function nav(filter) {
    var f = (filter || "").toLocaleLowerCase("tr"), groups = {}, order = [];
    var push = function (g, id, name, n) { if (f && name.toLocaleLowerCase("tr").indexOf(f) < 0 && id.indexOf(f) < 0) return; if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push([id, name, n]); };
    FOUND.forEach(function (id) { push("Temeller", id, F[id].name, ""); });
    C.forEach(function (c) { push(c.group, c.id, c.name, c.variants.length); });
    $("#dsNav").innerHTML = order.length ? order.map(function (g) {
      return '<div class="ds-group">' + g.toLocaleUpperCase("tr") + '</div>' + groups[g].map(function (x) { return '<a href="#' + x[0] + '"' + (x[0] === cur ? ' aria-current="page"' : "") + '>' + x[1] + (x[2] ? '<small>' + x[2] + '</small>' : "") + '</a>'; }).join("");
    }).join("") : '<p class="ds-none">"' + esc(filter) + '" ile eşleşen bileşen yok.</p>';
  }

  function head(eyebrow, name, desc, meta) { return '<div><div class="ds-eyebrow">' + eyebrow.toLocaleUpperCase("tr") + '</div><h1 tabindex="-1">' + name + '</h1><p class="ds-lead">' + desc + '</p>' + (meta ? '<div class="ds-meta" style="margin-top:8px">' + meta + '</div>' : "") + '</div>'; }

  function viewFound(id) {
    var f = F[id];
    $("#dsWrap").classList.add("no-props"); $("#dsProps").innerHTML = ""; $("#dsProps").hidden = true;
    $("#dsMain").innerHTML = head(f.group, f.name, f.desc) + f.body();
    if (f.after) f.after($("#dsMain"));
    document.title = f.name + " · Tasarım Sistemi";
  }

  function viewComp(c) {
    var p = propsOf(c);
    $("#dsWrap").classList.remove("no-props"); $("#dsProps").hidden = false;
    var tabs = [["onizleme", "Önizleme", ""], ["cesitler", "Çeşitler", c.variants.length], ["kod", "Kod", ""]];
    var body = tab === "cesitler" ? '<div class="ds-vars' + (c.width === "full" ? " full" : "") + '">' + c.variants.map(function (v) { return '<div class="ds-var"><b>' + esc(v[0]) + '</b>' + stage(c, merged(c, v[1])) + '</div>'; }).join("") + '</div>'
      : tab === "kod" ? '<div class="ds-codebar"><span class="hint">Sitede bu işaretleme <code>app.js</code> içinde metin olarak üretilir. <code>&lt;!-- icon("ad") --&gt;</code> yerine <code>icon("ad")</code> çağrılır.</span><button type="button" class="btn" id="dsCopy">Kopyala</button></div><pre class="ds-code"><code>' + esc(pretty(c.render(p))) + '</code></pre>'
      : '<div class="ds-bgsw" role="group" aria-label="Zemin"><button type="button" class="chip-btn" data-bg="beyaz" aria-pressed="' + (bg === "beyaz") + '">Beyaz</button><button type="button" class="chip-btn" data-bg="gri" aria-pressed="' + (bg === "gri") + '">Gri</button><span class="hint">Görünüm: ' + (T() ? "öğretmen" : "öğrenci") + '. Değiştirmek için üstteki düğmeyi kullanın.</span></div>' + stage(c, p, "ds-live");
    $("#dsMain").innerHTML = head(c.group, c.name, c.desc, '<span class="tag code">' + esc(c.cls) + '</span><span>Sitede: ' + esc(c.where) + '</span>') +
      '<div class="tabs ds-tabs" role="tablist" aria-label="Bileşen görünümü">' + tabs.map(function (t) { var on = t[0] === tab; return '<button type="button" class="tab" role="tab" data-dstab="' + t[0] + '" aria-selected="' + on + '" tabindex="' + (on ? 0 : -1) + '">' + t[1] + (t[2] ? ' <small>' + t[2] + '</small>' : "") + '</button>'; }).join("") + '</div>' +
      '<div role="tabpanel">' + body + '</div>' +
      '<div class="ds-rules"><h2>Kullanım</h2><ul>' + c.rules.map(function (r) { return '<li>' + r + '</li>'; }).join("") + '</ul></div>';
    // Özellikler
    $("#dsProps").innerHTML = '<div class="ds-props-h"><h2>Özellikler</h2><button type="button" class="chip-btn" id="dsReset">Sıfırla</button></div>' + c.props.map(function (pr) {
      var v = p[pr.k], id = "dsp-" + pr.k, lab = esc(pr.l) + '<code>' + pr.k + '</code>';
      if (pr.t === "bool") return '<label class="ds-prop ds-check"><input type="checkbox" data-k="' + pr.k + '"' + (bool(v) ? " checked" : "") + '>' + lab + '</label>';
      if (pr.t === "seg") return '<div class="ds-prop"><span id="' + id + '">' + lab + '</span><div class="ds-seg" role="group" aria-labelledby="' + id + '">' + pr.o.map(function (o) { return '<button type="button" class="chip-btn" data-k="' + pr.k + '" data-v="' + esc(o[0]) + '" aria-pressed="' + (String(v) === o[0]) + '">' + esc(o[1]) + '</button>'; }).join("") + '</div></div>';
      if (pr.t === "select") return '<label class="ds-prop"><span>' + lab + '</span><select data-k="' + pr.k + '">' + pr.o.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(v) === o[0] ? " selected" : "") + '>' + esc(o[1]) + '</option>'; }).join("") + '</select></label>';
      return '<label class="ds-prop"><span>' + lab + '</span><input type="text" data-k="' + pr.k + '" value="' + esc(v) + '"></label>';
    }).join("");
    document.title = c.name + " · Tasarım Sistemi";
  }

  // Önizlemeyi yalnızca sahnede yeniler; özellik panelindeki odak kaybolmaz
  function refresh(c) {
    var live = $(".ds-live");
    if (live && tab === "onizleme") { var p = propsOf(c), h = c.render(p); $(".ds-in", live).innerHTML = c.wrap ? c.wrap(p, h) : h; }
    else if (tab === "kod") $(".ds-code code").textContent = pretty(c.render(propsOf(c)));
  }

  function route(focus) {
    var id = location.hash.slice(1) || "renkler";
    var c = C.filter(function (x) { return x.id === id; })[0];
    if (!c && !F[id]) id = "renkler";
    cur = id; nav($("#dsFilter").value);
    if (c) viewComp(c); else viewFound(id);
    if (focus) { var h1 = $("#dsMain h1"); if (h1) h1.focus(); window.scrollTo(0, 0); }
  }

  function setRole(r) {
    role = r; store.set("role", r);
    document.documentElement.classList.toggle("role-ogrenci", r === "ogrenci");
    $$(".ds-role [data-role]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-role") === r); });
  }

  function toast(t) { var el = $("#dsToast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 1600); }
  // file:// altında Clipboard API olmayabilir: eski yöntemle dene
  function copy(text) {
    var done = function () { toast("Kopyalandı: " + (text.length > 40 ? text.slice(0, 40) + "…" : text)); };
    var old = function () { var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Kopyalanamadı"); } document.body.removeChild(ta); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, old); else old();
  }

  /* ---------- Olaylar ---------- */
  $(".ds-role").addEventListener("click", function (e) { var b = e.target.closest("[data-role]"); if (!b) return; setRole(b.getAttribute("data-role")); route(false); });
  $("#dsFilter").addEventListener("input", function () { nav(this.value); });
  $("#dsMain").addEventListener("click", function (e) {
    var t = e.target.closest("[data-dstab]"), b = e.target.closest("[data-bg]"), cp = e.target.closest("[data-copy]");
    if (t) { tab = t.getAttribute("data-dstab"); store.set("tab", tab); route(false); $('[data-dstab="' + tab + '"]').focus(); return; }
    if (b) { bg = b.getAttribute("data-bg"); store.set("bg", bg); route(false); return; }
    if (cp) { copy(cp.getAttribute("data-copy")); return; }
    if (e.target.id === "dsCopy") { copy($(".ds-code code").textContent); return; }
    // Önizlemedeki bağlantılar sayfadan çıkarmasın; slaytta cevabı göster çalışsın
    var a = e.target.closest(".ds-stage a"); if (a) e.preventDefault();
    var rv = e.target.closest(".ds-stage .reveal"); if (rv) { var ans = rv.nextElementSibling; if (ans) ans.hidden = !ans.hidden; }
  });
  $("#dsMain").addEventListener("keydown", function (e) {
    var t = e.target.closest("[data-dstab]"); if (!t || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
    var all = $$("[data-dstab]"), i = all.indexOf(t), n = all[(i + (e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length];
    n.click();
  });
  $("#dsProps").addEventListener("click", function (e) {
    var c = C.filter(function (x) { return x.id === cur; })[0]; if (!c) return;
    if (e.target.id === "dsReset") { delete state[c.id]; route(false); return; }
    var b = e.target.closest(".ds-seg [data-k]"); if (!b) return;
    propsOf(c)[b.getAttribute("data-k")] = b.getAttribute("data-v");
    $$('.ds-seg [data-k="' + b.getAttribute("data-k") + '"]').forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
    refresh(c);
  });
  $("#dsProps").addEventListener("input", function (e) {
    var c = C.filter(function (x) { return x.id === cur; })[0], k = e.target.getAttribute("data-k"); if (!c || !k) return;
    propsOf(c)[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    refresh(c);
  });
  $("#dsProps").addEventListener("change", function (e) { if (e.target.type === "checkbox" || e.target.tagName === "SELECT") { var ev = document.createEvent("Event"); ev.initEvent("input", true, true); e.target.dispatchEvent(ev); } });
  window.addEventListener("hashchange", function () { route(true); });

  setRole(role);
  route(false);
})();
</script>
</body>
</html>
